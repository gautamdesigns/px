<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>What is my Screen Resolution</title>

  <style>
    :root {
      --fborder: #08f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow:
        0 0 0.2vw red,
        0 0 0.5vw red,
        0 0 2vw red;
    }

    main {
      width: 90%;
      max-width: 40rem;
      border: 0.25rem solid white;
      border-radius: 1rem;
      padding: 2rem;
      background-color: black;
      animation: animatef 3s infinite alternate linear;
      box-shadow:
        0 0 0.25rem #fff,
        inset 0 0 0.25rem var(--fborder),
        0 0 1rem var(--fborder),
        inset 0 0 1rem var(--fborder),
        0 0 2rem var(--fborder),
        inset 0 0 2rem var(--fborder);
    }

    .container {
      border: 0.25rem solid white;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 2rem;
      box-shadow:
        0 0 0.25rem #fff,
        inset 0 0 0.25rem #08f,
        0 0 1rem #08f,
        inset 0 0 1rem #08f,
        0 0 2rem #08f,
        inset 0 0 2rem #08f;
    }

    h2 {
      font-size: 2rem;
      line-height: 1.5;
    }

    h3 {
      margin: 1rem 0;
      font-size: 1.3rem;
      font-weight: normal;
    }

    span#resolution {
      font-size: 2rem;
      text-shadow:
        0 0 0.2vw #08f,
        0 0 0.5vw #08f,
        0 0 2vw #08f;
    }

    span {
      text-shadow:
        0 0 0.2vw green,
        0 0 0.5vw green,
        0 0 2vw green;
    }

    @keyframes animatef {
      0% {
        --fborder: #f00;
      }

      50% {
        --fborder: yellow;
      }

      100% {
        --fborder: #0f0;
      }
    }
  </style>
</head>

<body>

  <main>

    <div class="container">

      <h2>
        Your Screen Resolution is
        <br />
        <span id="resolution"></span>
      </h2>

    </div>

    <h3>Screen Width : <span id="width"></span></h3>

    <h3>Screen Height : <span id="height"></span></h3>

    <h3>Available Screen Width : <span id="awidth"></span></h3>

    <h3>Available Screen Height : <span id="aheight"></span></h3>

    <h3>Screen Color Depth : <span id="color"></span></h3>

    <h3>Screen Pixel Depth : <span id="pixel"></span></h3>

  </main>

  <script>
    window.onload = () => {
      const ratio = window.devicePixelRatio;
      const realWidth = Math.round(screen.width * ratio);
      const realHeight = Math.round(screen.height * ratio);
      const availWidth = Math.round(screen.availWidth * ratio);
      const availHeight = Math.round(screen.availHeight * ratio);
      document.getElementById("width").innerText =
        realWidth + " px";
      document.getElementById("height").innerText =
        realHeight + " px";
      document.getElementById("resolution").innerText =
        realWidth + " X " + realHeight + " px";
      document.getElementById("awidth").innerText =
        availWidth + " px";
      document.getElementById("aheight").innerText =
        availHeight + " px";
      document.getElementById("color").innerText =
        screen.colorDepth + " bit";
      document.getElementById("pixel").innerText =
        screen.pixelDepth + " bit";
    };
  </script>

</body>

</html>
